<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dental Case Creation Prototype</title>

  <style>
    :root {
      --purple: #493973;
      --purple-dark: #362754;
      --purple-soft: #eeeaf7;
      --orange: #ef8b61;
      --orange-soft: #fff0e8;
      --green: #16845c;
      --red: #c52e47;
      --yellow: #ffae1a;
      --text: #414146;
      --muted: #85858d;
      --border: #d7d7dc;
      --panel: #fff;
      --page: #fafafa;
      --shadow: 0 2px 7px rgba(0, 0, 0, 0.18);
      --radius: 5px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-width: 1180px;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--page);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    svg {
      display: block;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* =========================================================
       Shared buttons / fields
    ========================================================= */

    .btn {
      min-height: 38px;
      padding: 7px 15px;
      border: 1px solid transparent;
      border-radius: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: white;
      color: var(--purple);
      font-weight: 650;
    }

    .btn svg {
      width: 20px;
      height: 20px;
    }

    .btn-outline {
      border-color: var(--purple);
    }

    .btn-primary {
      color: white;
      border-color: var(--purple);
      background: var(--purple);
    }

    .btn-success {
      color: white;
      border-color: var(--green);
      background: var(--green);
    }

    .btn-danger {
      color: white;
      border-color: var(--red);
      background: var(--red);
    }

    .btn-small {
      min-height: 32px;
      padding: 5px 10px;
      font-size: 12px;
    }

    .icon-button {
      width: 36px;
      height: 36px;
      padding: 5px;
      border: 0;
      color: var(--purple);
      background: transparent;
      display: grid;
      place-items: center;
    }

    .icon-button svg {
      width: 23px;
      height: 23px;
    }

    .field-group {
      margin-bottom: 15px;
    }

    .field-group label {
      display: block;
      margin-bottom: 5px;
      color: #666;
      font-size: 13px;
      font-weight: 650;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid #777;
      border-radius: 2px;
      outline: none;
      background: white;
      color: var(--text);
    }

    .input,
    .select {
      height: 42px;
      padding: 0 11px;
    }

    .textarea {
      min-height: 110px;
      resize: vertical;
      padding: 11px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--purple);
      box-shadow: 0 0 0 2px rgba(73, 57, 115, 0.1);
    }

    .required {
      color: #d8394d;
    }

    .muted {
      color: var(--muted);
    }

    /* =========================================================
       Header
    ========================================================= */

    .topbar {
      height: 102px;
      flex: 0 0 102px;
      display: grid;
      grid-template-columns: 39% 41% 20%;
      align-items: center;
      padding: 15px 28px;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid #ededed;
      z-index: 10;
    }

    .topbar.config-header {
      grid-template-columns: 39% 20% 41%;
    }

    .header-left,
    .header-center,
    .header-right {
      display: flex;
      align-items: center;
      min-width: 0;
    }

    .header-left {
      gap: 18px;
    }

    .header-center {
      justify-content: center;
    }

    .header-right {
      justify-content: flex-end;
      gap: 16px;
    }

    .page-title,
    .center-title,
    .right-title {
      color: var(--purple);
      font-weight: 300;
      line-height: 1;
    }

    .page-title {
      font-size: 41px;
      white-space: nowrap;
    }

    .center-title {
      font-size: 41px;
      text-align: center;
    }

    .right-title {
      margin-right: auto;
      font-size: 40px;
    }

    .header-buttons {
      margin-left: auto;
      display: flex;
      gap: 16px;
    }

    .header-button {
      min-width: 96px;
      height: 37px;
      padding: 5px 13px;
      border: 1px solid var(--purple);
      border-radius: 2px;
      background: white;
      color: var(--purple);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 650;
    }

    .header-button svg {
      width: 20px;
      height: 20px;
    }

    .back-button {
      width: 48px;
      height: 48px;
      padding: 5px;
      border: 0;
      color: var(--purple);
      background: transparent;
    }

    .back-button svg {
      width: 39px;
      height: 39px;
    }

    .tooth-header {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .header-subtitle {
      color: #555;
      font-size: 16px;
      white-space: nowrap;
    }

    .preset-card {
      width: 171px;
      height: 54px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-radius: 3px;
      background: white;
      box-shadow: var(--shadow);
      color: #555;
      font-size: 13px;
    }

    .preset-icon {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      color: white;
      background: #d7d2e6;
    }

    .preset-icon svg {
      width: 19px;
      height: 19px;
    }

    .preset-text {
      flex: 1;
    }

    .preset-text small {
      display: block;
      margin-top: 2px;
      color: #888;
      font-size: 10px;
      font-weight: 700;
    }

    /* =========================================================
       Main layouts
    ========================================================= */

    .workbench {
      height: calc(100vh - 102px);
      min-height: 0;
      display: grid;
      grid-template-columns: 39% 41% 20%;
      padding: 11px 27px 25px;
      background:
        linear-gradient(
          90deg,
          #fafafa 0%,
          #ffffff 45%,
          #fafafa 100%
        );
    }

    .workbench.config-layout {
      grid-template-columns: 39% 20% 41%;
    }

    .left-panel,
    .center-panel,
    .right-panel {
      min-width: 0;
      min-height: 0;
    }

    .left-panel {
      padding-right: 27px;
      overflow-y: auto;
    }

    .center-panel {
      position: relative;
      overflow: hidden;
    }

    .right-panel {
      position: relative;
      padding-left: 27px;
      border-left: 1px solid #eeeeee;
      overflow-y: auto;
    }

    .config-layout .center-panel {
      padding: 0 20px 0 7px;
      overflow-y: auto;
    }

    .config-layout .right-panel {
      padding: 0 17px 20px 28px;
    }

    /* =========================================================
       Helpers
    ========================================================= */

    .flow-help {
      min-height: 38px;
      margin: 4px 7px 11px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ed7950;
      font-size: 14px;
      font-weight: 650;
    }

    .flow-help svg {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .screen-help {
      margin: 7px 0 12px;
      padding: 10px 12px;
      color: #725120;
      background: #fff8df;
      border: 1px solid #f0d99e;
      border-radius: 3px;
      font-size: 13px;
      line-height: 1.4;
    }

    /* =========================================================
       Project panel
    ========================================================= */

    .panel-card {
      margin-bottom: 19px;
      overflow: hidden;
      border-radius: var(--radius);
      background: white;
      box-shadow: var(--shadow);
    }

    .project-date-row {
      min-height: 57px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid #999;
      color: #666;
      font-size: 17px;
    }

    .project-date-row svg {
      width: 19px;
      height: 19px;
    }

    .due-label {
      margin-left: auto;
      color: #f19573;
      font-weight: 700;
    }

    .project-form {
      padding: 28px 20px 18px;
    }

    .project-form-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 180px;
      gap: 15px;
      margin-bottom: 24px;
    }

    .floating-field {
      min-height: 42px;
      position: relative;
      border: 1px solid #777;
      border-radius: 2px;
      background: white;
    }

    .floating-field label {
      position: absolute;
      top: -10px;
      left: 10px;
      padding: 0 5px;
      color: #666;
      background: white;
      font-size: 13px;
    }

    .floating-field input,
    .floating-field select {
      width: 100%;
      height: 40px;
      padding: 8px 10px;
      border: 0;
      outline: none;
      background: transparent;
      color: #444;
    }

    .notes-head,
    .preview-head {
      min-height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 9px;
      border-bottom: 1px solid #999;
      color: #666;
      font-weight: 650;
    }

    .notes-head svg,
    .preview-head svg {
      width: 20px;
      height: 20px;
    }

    .notes-head .expand-icon {
      margin-left: auto;
    }

    .notes-body {
      padding: 20px;
    }

    .notes-body textarea {
      width: 100%;
      height: 285px;
      padding: 13px;
      resize: none;
      border: 1px solid #777;
      border-radius: 3px;
      outline: none;
    }

    .preview-tabs {
      min-height: 56px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      gap: 24px;
      border-bottom: 1px solid #777;
      color: #777;
      font-size: 14px;
      font-weight: 650;
    }

    .preview-tab {
      min-height: 56px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .preview-tab.active {
      color: #666;
      border-bottom: 3px solid var(--orange);
    }

    .preview-tab svg {
      width: 19px;
      height: 19px;
    }

    .preview-body {
      min-height: 69px;
      padding: 22px 20px;
      font-size: 15px;
    }

    /* =========================================================
       Dental chart
    ========================================================= */

    .chart-area {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .chart-toolbar {
      width: 100%;
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;
      color: var(--purple);
      font-size: 15px;
      font-weight: 700;
    }

    .toggle {
      width: 33px;
      height: 16px;
      padding: 0;
      position: relative;
      border: 0;
      border-radius: 20px;
      background: #babac0;
    }

    .toggle::after {
      content: "";
      position: absolute;
      left: 0;
      top: -1px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--purple);
      transition: 0.18s ease;
    }

    .toggle.on::after {
      left: 16px;
    }

    .dental-chart {
      width: 565px;
      height: 765px;
      max-height: calc(100vh - 237px);
      margin-top: -3px;
    }

    .tooth {
      cursor: pointer;
      outline: none;
    }

    .tooth-body {
      fill: var(--tooth-fill, #d9d9da);
      stroke: #444;
      stroke-width: 1.1;
      transition: 0.16s ease;
    }

    .tooth:hover .tooth-body {
      filter: brightness(0.91);
      stroke-width: 1.8;
    }

    .tooth-groove {
      fill: none;
      stroke: #4a4a4a;
      stroke-width: 1.05;
      stroke-linecap: round;
    }

    .tooth text {
      fill: var(--tooth-text, #111);
      text-anchor: middle;
      dominant-baseline: middle;
      font-size: 15px;
      pointer-events: none;
    }

    .chart-legend {
      position: absolute;
      left: 48%;
      top: 410px;
      min-width: 240px;
      display: grid;
      gap: 4px;
      font-size: 22px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
    }

    .chart-bottom-fields {
      width: 100%;
      max-width: 715px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: -12px;
    }

    .chart-bottom-fields.single {
      grid-template-columns: 1fr;
      max-width: 350px;
      align-self: flex-start;
      margin-left: 20px;
    }

    /* =========================================================
       Product catalogue
    ========================================================= */

    .catalog {
      padding: 0 12px 20px;
    }

    .catalog-selected {
      margin: 5px 0 10px;
      padding: 9px 11px;
      color: var(--purple);
      background: var(--purple-soft);
      border-left: 4px solid var(--purple);
      font-size: 13px;
      line-height: 1.4;
    }

    .category {
      margin-bottom: 10px;
    }

    .category-title {
      margin-bottom: 4px;
      color: #555;
      font-size: 18px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .product-button {
      min-height: 48px;
      padding: 6px 9px;
      border: 0;
      border-radius: 2px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: white;
      background: var(--product-color);
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.08;
    }

    .product-button:hover {
      filter: brightness(1.06);
    }

    .product-button.selected {
      outline: 4px solid #f29065;
      outline-offset: -4px;
    }

    .product-button svg {
      width: 39px;
      height: 32px;
      flex: 0 0 auto;
    }

    /* =========================================================
       Material cards
    ========================================================= */

    .material-pane-title,
    .options-pane-title {
      margin: 0 0 9px;
      color: var(--purple);
      font-size: 38px;
      font-weight: 300;
    }

    .manufacturing-select {
      width: 100%;
      height: 31px;
      margin-bottom: 14px;
      border: 0;
      border-bottom: 1px solid #555;
      outline: none;
      background: transparent;
    }

    .material-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(125px, 148px));
      gap: 14px;
    }

    .material-card {
      width: 100%;
      height: 137px;
      padding: 5px;
      position: relative;
      overflow: hidden;
      border: 1px solid #ddd;
      border-radius: 2px;
      background: #fafafa;
      box-shadow: 0 1px 3px rgba(0,0,0,.22);
      text-align: left;
    }

    .material-card.selected {
      padding: 2px;
      border: 4px solid var(--orange);
    }

    .material-card.selected::before {
      content: "";
      position: absolute;
      right: 0;
      top: 0;
      z-index: 2;
      width: 29px;
      height: 29px;
      background: var(--orange);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }

    .material-card.selected::after {
      content: "✓";
      position: absolute;
      right: 2px;
      top: -5px;
      z-index: 3;
      color: white;
      font-size: 21px;
      font-weight: 800;
    }

    .material-card svg {
      width: 100%;
      height: 101px;
    }

    .material-name {
      position: absolute;
      left: 7px;
      bottom: 8px;
      max-width: 130px;
      color: #444;
      font-size: 13px;
      font-weight: 750;
      line-height: 1.05;
    }

    /* =========================================================
       Options panel
    ========================================================= */

    .options-content {
      padding-bottom: 90px;
    }

    .option-section {
      margin-bottom: 18px;
    }

    .option-section h3 {
      margin: 0 0 7px;
      color: #59595e;
      font-size: 18px;
      font-weight: 450;
    }

    .option-note {
      margin: -2px 0 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 7px;
    }

    .option-button {
      min-height: 46px;
      padding: 7px 11px;
      position: relative;
      border: 1px solid #aaa;
      color: white;
      background: var(--option-color, var(--purple));
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.15;
    }

    .option-button.selected {
      outline: 4px solid var(--orange);
      outline-offset: -4px;
    }

    .option-button.selected::after {
      content: "✓";
      position: absolute;
      right: 7px;
      top: 3px;
      font-size: 19px;
      font-weight: 800;
    }

    .option-input-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .shape-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(125px, 1fr));
      gap: 9px;
    }

    .shape-card {
      min-height: 132px;
      padding: 8px;
      border: 2px solid var(--border);
      border-radius: 3px;
      background: white;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .shape-card.selected {
      border-color: var(--orange);
      box-shadow: 0 0 0 2px #ffd2bf;
    }

    .shape-card svg {
      width: 100%;
      height: 88px;
      margin-bottom: 5px;
    }

    .config-actions {
      position: sticky;
      bottom: 0;
      z-index: 8;
      padding: 13px 0 2px;
      display: flex;
      justify-content: flex-end;
      gap: 28px;
      background:
        linear-gradient(
          to bottom,
          rgba(250,250,250,0),
          rgba(250,250,250,.97) 25%
        );
    }

    .config-action {
      width: 160px;
      height: 60px;
      border-radius: 2px;
      font-size: 18px;
      font-weight: 700;
    }

    .config-clear {
      border: 1px solid #aca4bd;
      color: #a39bb4;
      background: white;
    }

    .config-ok {
      border: 1px solid var(--purple);
      color: white;
      background: var(--purple);
      box-shadow: 0 2px 5px rgba(0,0,0,.2);
    }

    /* =========================================================
       Right prescription panel
    ========================================================= */

    .action-list {
      margin-bottom: 17px;
    }

    .action-item {
      min-height: 60px;
      padding: 0 11px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid #aaa;
      color: #777;
      background: transparent;
      cursor: pointer;
    }

    .action-item.active {
      color: #444;
      background: #e1e1e1;
      border-bottom-color: transparent;
    }

    .action-item.disabled {
      color: #aaa;
      cursor: not-allowed;
    }

    .action-icon {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .action-icon svg {
      width: 34px;
      height: 34px;
    }

    .action-purple {
      color: #b03bc1;
    }

    .action-yellow {
      color: #efb359;
    }

    .action-lilac {
      color: #aaa3bf;
    }

    .action-green {
      color: #75bd75;
    }

    .action-blue {
      color: #7189cd;
    }

    .prescription-summary {
      margin-top: 13px;
      padding: 14px;
      border: 1px solid #ddd;
      background: white;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    .prescription-summary h3 {
      margin: 0 0 12px;
      color: var(--purple);
      font-size: 17px;
    }

    .empty-prescription {
      padding: 13px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .rx-item {
      padding: 10px 0;
      border-bottom: 1px solid #e1e1e1;
    }

    .rx-item:last-child {
      border-bottom: 0;
    }

    .rx-head {
      display: grid;
      grid-template-columns: 10px 1fr auto;
      gap: 8px;
      align-items: start;
    }

    .rx-color {
      width: 10px;
      height: 37px;
      border-radius: 2px;
    }

    .rx-copy strong,
    .rx-copy small {
      display: block;
    }

    .rx-copy strong {
      font-size: 13px;
    }

    .rx-copy small {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }

    .rx-actions {
      display: flex;
      gap: 3px;
    }

    .rx-action {
      width: 25px;
      height: 25px;
      padding: 3px;
      border: 0;
      background: transparent;
      color: var(--purple);
    }

    .rx-action.delete {
      color: var(--red);
    }

    .rx-action svg {
      width: 17px;
      height: 17px;
    }

    .service-box {
      margin-top: 13px;
      padding-top: 12px;
      border-top: 1px solid #ccc;
    }

    .service-box label {
      display: block;
      margin: 0 0 5px;
      color: #666;
      font-size: 12px;
      font-weight: 700;

      height: 36px;
      margin-bottom: 9px;
      border: 1px solid #888;
      background: white;
      padding: 0 8px;

    .price-lines {
      margin-top: 10px;
    }

    .price-line {
      padding: 4px 0;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: #666;
      font-size: 12px;
    }

    .price-line.total {
      margin-top: 6px;
      padding-top: 9px;
      border-top: 2px solid #ddd;
      color: var(--purple);
      font-size: 17px;
      font-weight: 800;

      font-size: 41px;
      font-weight: 800;
      letter-spacing: -3px;
      text-align: right;

      color: #999;
      font-size: 13px;
      text-align: right;
    }

    ========================================================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(30, 24, 45, 0.58);
    }

    .modal {
      width: min(960px, 96vw);
      max-height: 91vh;
      overflow-y: auto;
      border-radius: 6px;
      background: white;
      box-shadow: 0 18px 60px rgba(0,0,0,.34);
    }

    .modal.small {
      width: min(650px, 95vw);
    }

    .modal-header {
      min-height: 68px;
      padding: 0 21px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .modal-header h2 {
      margin: 0;
      color: var(--purple);
      font-size: 27px;
      font-weight: 400;
    }

    .modal-close {
      width: 35px;
      height: 35px;
      border: 0;
      color: #777;
      background: transparent;
      font-size: 27px;
    }

    .modal-body {
      padding: 21px;
    }

    .modal-footer {
      min-height: 72px;
      padding: 13px 21px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 12px;
      border-top: 1px solid var(--border);
      background: #fafafa;
    }

    .modal-note {
      margin-bottom: 15px;
      padding: 11px 13px;
      color: #65501e;
      background: #fff8dc;
      border: 1px solid #ecd795;
      border-radius: 4px;
      font-size: 13px;
      line-height: 1.45;
    }

    .upload-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .upload-card {
      min-height: 142px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 2px dashed #c5c5cb;
      border-radius: 5px;
      background: #fbfbfc;
    }

    .upload-card.complete {
      border-style: solid;
      border-color: var(--green);
      background: #edf9f4;
    }

    .upload-card h4 {
      margin: 0 0 5px;
      color: var(--purple);
      font-size: 15px;
    }

    .upload-card p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
    }

    .upload-status {
      float: right;
      color: var(--red);
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .upload-status.optional {
      color: var(--muted);
    }

    .upload-file-list {
      margin: 9px 0 0;
      color: var(--green);
      font-size: 11px;
      line-height: 1.4;
    }

    .file-input {
      display: none;
    }

    .upload-label {
      min-height: 35px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border: 1px solid var(--purple);
      border-radius: 3px;
      color: var(--purple);
      background: white;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .upload-label svg {
      width: 18px;
      height: 18px;
    }

    .review-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 18px;
    }

    .review-section {
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .review-section h3 {
      margin: 0 0 12px;
      color: var(--purple);
      font-size: 18px;
    }

    .review-item {
      padding: 11px 0;
      border-bottom: 1px solid #e3e3e5;
    }

    .review-item:last-child {
      border-bottom: 0;
    }

    .review-item strong,
    .review-item small {
      display: block;
    }

    .review-item small {
      margin-top: 4px;
      color: var(--muted);
    }

    .review-summary {
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: #fafafa;
    }

    .payment-methods {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 15px;
    }

    .payment-method {
      min-height: 67px;
      border: 2px solid var(--border);
      color: var(--purple);
      background: white;
      font-weight: 750;
    }

    .payment-method.selected {
      border-color: var(--purple);
      background: var(--purple-soft);
    }

    .load-list {
      display: grid;
      gap: 10px;
    }

    .load-item {
      padding: 14px;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 15px;
      border: 1px solid var(--border);
      border-radius: 4px;
    }

    .load-item strong,
    .load-item small {
      display: block;
    }

    .load-item small {
      margin-top: 4px;
      color: var(--muted);
    }

    .success-view {
      padding: 30px;
      text-align: center;
    }

    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 17px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: var(--green);
    }

    .success-icon svg {
      width: 42px;
      height: 42px;
    }

    .success-view h2 {
      color: var(--purple);
      font-weight: 400;
    }

    .success-view p {
      color: var(--muted);
      line-height: 1.55;
    }

    /* =========================================================
       Toast
    ========================================================= */

    .toast {
      min-width: 300px;
      max-width: 650px;
      padding: 13px 19px;
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 200;
      border-radius: 4px;
      color: white;
      background: var(--purple-dark);
      box-shadow: 0 8px 25px rgba(0,0,0,.28);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 100px);
      transition: 0.25s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    @media (max-width: 1350px) {
      .page-title,
      .center-title,
      .right-title {
        font-size: 32px;
      }

      .product-button {
        font-size: 11px;
      }

      .chart-legend {
        font-size: 18px;
      }
    }

</head>

    /* =========================================================
       Generic helpers
    ========================================================= */

    function escapeHtml(value = "") {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function money(value) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(Number(value || 0));
    }

    function currentDateText() {
      return new Date().toLocaleString([], {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(window.dentalToastTimer);

      window.dentalToastTimer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2600);
    }

    function createCaseId() {
      return (
        "CASE-" +
        new Date().getFullYear() +
        "-" +
        Math.floor(10000 + Math.random() * 90000)
      );
    }

    function storedCases() {
      return JSON.parse(
        localStorage.getItem("exocadPrototypeCases") || "[]"
      );
    }

    function persistCases(cases) {
      localStorage.setItem(
        "exocadPrototypeCases",
        JSON.stringify(cases)
      );
    }

    function selectedTeethText(teeth = state.workingTeeth) {
      if (!teeth.length) return "No teeth selected";

      if (state.selectedArch) {
        return state.selectedArch;
      }

      return teeth.join(", ");
    }

    function primaryItems() {
      return state.case.items.filter(item => {
        return PRODUCTS[item.productKey].flow !== "marker";
      });
    }

    /* =========================================================
       Default product configurations
    ========================================================= */

    function defaultConfig(productKey) {
      const product = PRODUCTS[productKey];

      if (product.flow === "crown") {
        return {
          restorationRole:
            productKey === "pontic" ? "Pontic" : "Crown",
          contour: "Full Contour",
          crownType: "Crown",
          cervical: "Pull to Margin",
          scannedAnatomy: "No",
          additionalScan: "None",
          information: ""
        };
      }

      if (product.flow === "implant") {
        return {
          restorationRole: "Crown",
          contour: "Full Contour",
          crownType: "Implant Crown",
          implantBrand: "Nobel Biocare",
          customImplantBrand: "",
          retention: "Cement Retained Custom Abutment",
          abutmentMaterial: "Custom Zirconia on Ti-Base",
          tiBaseType: "OEM",
          scanAbutmentInfo: "",
          platformSize: "",
          cervical: "Pull to Margin",
          information: ""
        };
      }

      if (product.flow === "denture") {
        return {
          toothShape: "Round",
          toothLibrary: "Library 1",
          anteriorSetup: "Naturally Straight",
          posteriorSetup: "Lingualized Occlusion",
          postDam: "Butterfly",
          periphery: "In the depth of the sulcus",
          finishing: "Medium Root Effect",
          midline: "Follow Natural Markers",
          gingiva: "Medium Gingiva",
          information: ""
        };
      }

      if (product.flow === "biteplane") {
        return {
          splintType: "Type A — Directional Splint",
          contactDepth: "0.1 mm",
          minimumThickness: "2 mm",
          guidance: "Medium",
          information: ""
        };
      }

      if (product.flow === "partial") {
        return {
          partialType:
            productKey === "castPartial"
              ? "Cast Partial Denture"
              : "Acrylic Partial Denture",
          framework: "Standard Framework",
          clasp: "Akers Clasp",
          claspMaterial:
            productKey === "castPartial"
              ? "CrCo"
              : "Acrylic PMMA",
          support: "Tooth Supported",
          information: ""
        };
      }

      return {
        contour: "Full Contour",
        information: ""
      };
    }

    function toothAppearance(number) {
      if (
        state.screen !== "project" &&
        state.workingTeeth.includes(number)
      ) {
        return {
          fill: "#ff1717",
          text: "#ffffff"
        };
      }

      const matchingItem = [...state.case.items]
        .reverse()
        .find(item => item.teeth.includes(number));

      if (matchingItem) {
        return {
          fill: PRODUCTS[matchingItem.productKey].color,
          text: "#ffffff"
        };
      }

      return {
        fill: "#d8d8d8",
        text: "#111111"
      };
    }

      const appearance = toothAppearance(number);

      return `

           style="

           "
           transform="translate(${x},${y}) scale(${scale})"
           onclick="toothClick(${number},event)"
           role="button"

    function calculateTotals() {
      const design = state.case.items.reduce((sum, item) => {
        return sum + item.unitPrice * item.quantity;
      }, 0);

      const approval =
        state.case.service === "design"
          ? 0
          : 35;

      const manufacturing =
        state.case.service === "manufacture"
          ? state.case.items.reduce((sum, item) => {
              const product = PRODUCTS[item.productKey];

              if (product.flow === "marker") {
                return sum;
              }

              const rate =
                state.case.manufactureMethod === "print"
                  ? 58
                  : 72;

              return sum + rate * item.quantity;
            }, 0)
          : 0;

      const output =
        state.case.service === "manufacture" &&
        state.case.output === "applianceModels"
          ? 45
          : 0;

      const modelService =
        state.case.modelService === "design"
          ? 25
          : state.case.modelService === "designPrint"
            ? 62
            : 0;

      return {
        design,
        approval,
        manufacturing,
        output,
        modelService,
        total:
          design +
          approval +
          manufacturing +
          output +
          modelService
      };
    }

    /* =========================================================
       Case and tooth interactions
    ========================================================= */

    function toothClick(number, event) {
      if (state.screen === "project") {
        state.currentTooth = number;
        state.workingTeeth = [number];
        state.selectedArch = "";
        state.activeProductKey = null;
        state.selectedMaterial = null;
        state.workingConfig = {};
        state.editingItemId = null;
        state.screen = "catalog";
        render();
        return;
      }

      const product = state.activeProductKey
        ? PRODUCTS[state.activeProductKey]
        : null;

      if (product && product.mode === "arch") {
        const upper = UPPER_TEETH.includes(number);

        state.workingTeeth =
          upper ? [...UPPER_TEETH] : [...LOWER_TEETH];

        state.selectedArch =
          upper ? "Upper Arch" : "Lower Arch";

        state.currentTooth = number;
        render();
        return;
      }

      const useMulti =
        state.multiSelect ||
        event.ctrlKey ||
        event.metaKey;

      if (useMulti) {
        if (state.workingTeeth.includes(number)) {
          state.workingTeeth =
            state.workingTeeth.filter(tooth => tooth !== number);
        } else {
          state.workingTeeth.push(number);
        }
      } else {
        state.workingTeeth = [number];
      }

      state.currentTooth = number;
      state.selectedArch = "";
      state.workingTeeth.sort((a, b) => a - b);
      render();
    }

    function toggleMultiSelect() {
      state.multiSelect = !state.multiSelect;
      render();
    }

    function chooseProduct(productKey) {
      if (!state.workingTeeth.length) {
        showToast("Select at least one tooth first.");
        return;
      }

      const product = PRODUCTS[productKey];

      state.activeProductKey = productKey;
      state.workingConfig = defaultConfig(productKey);
      state.selectedMaterial = null;
      state.editingItemId = null;

      if (product.mode === "arch") {
        const upper = UPPER_TEETH.includes(state.currentTooth);

        state.workingTeeth =
          upper ? [...UPPER_TEETH] : [...LOWER_TEETH];

        state.selectedArch =
          upper ? "Upper Arch" : "Lower Arch";
      }

      if (product.flow === "marker") {
        commitMarkerItem(productKey);
        return;
      }

      state.screen = "material";
      render();
    }

    function selectMaterial(encodedName) {
      state.selectedMaterial = decodeURIComponent(encodedName);
      render();
    }

    function setWorkingOption(field, encodedValue) {
      state.workingConfig[field] =
        decodeURIComponent(encodedValue);

      render();
    }

    function clearWorkingConfiguration() {
      if (!state.activeProductKey) return;

      state.workingConfig =
        defaultConfig(state.activeProductKey);

      state.selectedMaterial = null;
      render();
    }

    function itemQuantity(product) {
      if (product.quantity === "one") return 1;
      return state.workingTeeth.length;
    }

    function commitMarkerItem(productKey) {
      const product = PRODUCTS[productKey];

      const item = {
        id:
          "item-" +
          Date.now() +
          "-" +
          Math.random().toString(16).slice(2),
        productKey,
        teeth: [...state.workingTeeth],
        arch: state.selectedArch,
        quantity: itemQuantity(product),
        unitPrice: product.price,
        material: "",
        shade: state.case.shade,
        config: {}
      };

      state.case.items.push(item);
      resetWorkingState();
      state.screen = "project";
      state.case.status = "Unsaved Changes";

      showToast(`${product.label} added.`);
      render();
    }

    function commitPrescriptionItem() {
      if (!state.activeProductKey) {
        showToast("Select a product.");
        return;
      }

      if (!state.workingTeeth.length) {
        showToast("Select at least one tooth.");
        return;
      }

      if (!state.selectedMaterial) {
        showToast("Select a material.");
        return;
      }

      const product = PRODUCTS[state.activeProductKey];

      const item = {
        id:
          state.editingItemId ||
          (
            "item-" +
            Date.now() +
            "-" +
            Math.random().toString(16).slice(2)
          ),
        productKey: state.activeProductKey,
        teeth: [...state.workingTeeth],
        arch: state.selectedArch,
        quantity: itemQuantity(product),
        unitPrice: product.price,
        material: state.selectedMaterial,
        shade: state.case.shade,
        config: clone(state.workingConfig)
      };

      if (state.editingItemId) {
        const index = state.case.items.findIndex(
          existing => existing.id === state.editingItemId
        );

        if (index !== -1) {
          state.case.items[index] = item;
        }
      } else {
        state.case.items.push(item);
      }

      const wasEditing = Boolean(state.editingItemId);

      resetWorkingState();
      state.screen = "project";
      state.case.status = "Unsaved Changes";

      showToast(
        wasEditing
          ? "Prescription item updated."
          : "Prescription item added."
      );

      render();
    }

    function resetWorkingState() {
      state.workingTeeth = [];
      state.selectedArch = "";
      state.activeProductKey = null;
      state.selectedMaterial = null;
      state.workingConfig = {};
      state.editingItemId = null;
      state.multiSelect = false;
    }

    function editPrescriptionItem(itemId) {
      const item = state.case.items.find(
        existing => existing.id === itemId
      );

      if (!item) return;

      state.editingItemId = item.id;
      state.activeProductKey = item.productKey;
      state.workingTeeth = [...item.teeth];
      state.selectedArch = item.arch || "";
      state.currentTooth = item.teeth[0] || 14;
      state.selectedMaterial = item.material;
      state.workingConfig = clone(item.config);
      state.screen = "material";

      render();
    }

    function removePrescriptionItem(itemId) {
      state.case.items =
        state.case.items.filter(item => item.id !== itemId);

      state.case.status = "Unsaved Changes";
      render();
      showToast("Prescription item removed.");
    }

    function openPrescriptionDesigner() {
      if (state.case.items.length) {
        const editable = state.case.items.find(item => {
          return PRODUCTS[item.productKey].flow !== "marker";
        });

        if (editable) {
          editPrescriptionItem(editable.id);
          return;
        }
      }

      showToast("Click a tooth in the dental chart to start.");
    }

    function goBack() {
      if (state.screen === "material") {
        state.screen = "catalog";
        state.selectedMaterial = null;
        render();
        return;
      }

      if (state.screen === "catalog") {
        resetWorkingState();
        state.screen = "project";
        render();
      }
    }

    /* =========================================================
       Case service
    ========================================================= */

    function setService(value) {
      state.case.service = value;
      render();
    }

    function setManufactureMethod(value) {
      state.case.manufactureMethod = value;
      render();
    }

    function setOutput(value) {
      state.case.output = value;
      render();
    }

    function setModelService(value) {
      state.case.modelService = value;
      render();
    }

    function focusCaseSetup() {
      document.getElementById("leftPanel").scrollTo({
        top: 0,
        behavior: "smooth"
      });

      showToast("Complete Client and Reference before saving.");
    }

    /* =========================================================
       Save / New / Load
    ========================================================= */

    function validateCaseBasics() {
      if (!state.case.client) {
        showToast("Please select a client.");
        return false;
      }

      if (!state.case.reference.trim()) {
        showToast("Reference is required.");
        return false;
      }

      if (!primaryItems().length) {
        showToast("Add at least one billable product.");
        return false;
      }

      return true;
    }

    function saveCase(silent = false) {
      if (!validateCaseBasics()) {
        return false;
      }

      if (!state.case.id) {
        state.case.id = createCaseId();
        state.case.createdAt = new Date().toISOString();
      }

      state.case.updatedAt = new Date().toISOString();

      if (state.case.status !== "Submitted") {
        state.case.status = "Draft";
      }

      const cases = storedCases();
      const index = cases.findIndex(
        item => item.id === state.case.id
      );

      if (index === -1) {
        cases.push(clone(state.case));
      } else {
        cases[index] = clone(state.case);
      }

      persistCases(cases);

      if (!silent) {
        showToast(`${state.case.id} saved successfully.`);
      }

      render();
      return true;
    }

    function newCase() {
      if (
        state.case.items.length &&
        !confirm("Start a new case? Unsaved changes may be lost.")
      ) {
        return;
      }

      state.case = newCaseData();
      state.screen = "project";
      state.currentTooth = 14;
      resetWorkingState();
      closeModal();
      render();

      showToast("New case created.");
    }

    function duplicateCase() {
      if (!state.case.id) return;

      const duplicate = clone(state.case);

      duplicate.id = "";
      duplicate.reference =
        duplicate.reference + " - Copy";
      duplicate.status = "Unsaved Changes";
      duplicate.createdAt = new Date().toISOString();
      duplicate.updatedAt = new Date().toISOString();

      state.case = duplicate;
      resetWorkingState();
      state.screen = "project";

      render();
      showToast("Case duplicated. Save to create a new case ID.");
    }

    function openLoadModal() {
      const cases = storedCases()
        .sort((a, b) => {
          return new Date(b.updatedAt) - new Date(a.updatedAt);
        });

      openModal(`
        <section class="modal small">
          <div class="modal-header">
            <h2>Load Case</h2>
            <button class="modal-close" onclick="closeModal()">×</button>
          </div>

          <div class="modal-body">
            ${
              cases.length
                ? `
                  <div class="load-list">
                    ${cases.map(caseItem => `
                      <div class="load-item">
                        <div>
                          <strong>
                            ${escapeHtml(caseItem.reference)}
                          </strong>

                          <small>
                            ${escapeHtml(caseItem.id)}
                            ·
                            ${escapeHtml(caseItem.patientName || "No patient name")}
                            ·
                            ${escapeHtml(caseItem.status)}
                          </small>
                        </div>

                        <button class="btn btn-outline btn-small"
                                onclick="loadCase('${caseItem.id}')">
                          Load
                        </button>
                      </div>
                    `).join("")}
                  </div>
                `
                : `
                  <div class="muted"
                       style="padding:35px;text-align:center">
                    No saved cases found.
                  </div>
                `
            }
          </div>
        </section>
      `);
    }

    function loadCase(caseId) {
      const caseItem = storedCases().find(
        item => item.id === caseId
      );

      if (!caseItem) return;

      state.case = clone(caseItem);
      state.screen = "project";
      resetWorkingState();
      closeModal();
      render();

      showToast(`${caseId} loaded.`);
    }

    /* =========================================================
       Digital file protocol
    ========================================================= */

    function getProtocolFields() {
      const fields = new Map();

      state.case.items.forEach(item => {
        const protocolKey =
          PRODUCTS[item.productKey].protocol;

        const protocol =
          PROTOCOLS[protocolKey] || [];

        protocol.forEach(field => {
          if (!fields.has(field.id)) {
            fields.set(field.id, clone(field));
          } else if (field.required) {
            fields.get(field.id).required = true;
          }
        });
      });

      return [...fields.values()];
    }

    function openFilesModal() {
      if (!state.case.items.length) {
        showToast("Add prescription items first.");
        return;
      }

      renderFilesModal();
    }

    function renderFilesModal() {
      const fields = getProtocolFields();

      openModal(`
        <section class="modal">
          <div class="modal-header">
            <h2>Digital Submission Protocol</h2>

            <button class="modal-close"
                    onclick="closeModal()">
              ×
            </button>
          </div>

          <div class="modal-body">
            <div class="modal-note">
              Upload the required upper arch, lower arch and bite scan.
              Full denture cases also require clinical photos or a face scan.
              This prototype stores file names only.
            </div>

            <div class="upload-grid">
              ${fields.map(field => {
                const files =
                  state.case.uploads[field.id] || [];

                return `
                  <div class="upload-card
                              ${files.length ? "complete" : ""}">
                    <div>
                      <span class="upload-status
                        ${field.required ? "" : "optional"}">
                        ${field.required ? "Required" : "Optional"}
                      </span>

                      <h4>${field.label}</h4>
                      <p>${field.accept}</p>

                      ${
                        files.length
                          ? `
                            <div class="upload-file-list">
                              ${files.map(file => `
                                ✓ ${escapeHtml(file.name)}
                              `).join("<br>")}
                            </div>
                          `
                          : ""
                      }
                    </div>

                    <input class="file-input"
                           id="upload-${field.id}"
                           type="file"
                           multiple
                           accept="${field.accept}"
                           onchange="
                             handleUpload(
                               '${field.id}',
                               this.files
                             )
                           " />

                    <label class="upload-label"
                           for="upload-${field.id}">
                      ${icon("upload")}
                      ${
                        files.length
                          ? "Add / Replace Files"
                          : "Choose Files"
                      }
                    </label>
                  </div>
                `;
              }).join("")}
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline"
                    onclick="closeModal()">
              Close
            </button>

            <button class="btn btn-primary"
                    onclick="validateFilesAndReview()">
              Review Case
            </button>
          </div>
        </section>
      `);
    }

    function handleUpload(fieldId, fileList) {
      state.case.uploads[fieldId] =
        [...fileList].map(file => ({
          name: file.name,
          size: file.size,
          type: file.type
        }));

      renderFilesModal();
      showToast("Files attached.");
    }

    function validateFiles(showMessage = true) {
      const fields = getProtocolFields();

      const missing = fields.filter(field => {
        return (
          field.required &&
          !(state.case.uploads[field.id] || []).length
        );
      });

      if (missing.length) {
        if (showMessage) {
          showToast(
            "Missing required files: " +
            missing.map(item => item.label).join(", ")
          );
        }

        return false;
      }

      const hasDenture = state.case.items.some(item => {
        return PRODUCTS[item.productKey].flow === "denture";
      });

      if (hasDenture) {
        const photoIds = [
          "frontSmile",
          "leftSmile",
          "rightSmile",
          "frontRetracted"
        ];

        const hasPhotos = photoIds.some(id => {
          return (state.case.uploads[id] || []).length;
        });

        const hasFaceScan =
          (state.case.uploads.faceScanRetractors || []).length ||
          (state.case.uploads.faceScanNoRetractors || []).length;

        if (!hasPhotos && !hasFaceScan) {
          if (showMessage) {
            showToast(
              "Full denture cases require photos or a face scan."
            );
          }

          return false;
        }
      }

      return true;
    }

    function validateFilesAndReview() {
      if (!validateFiles()) return;
      openReviewModal();
    }

    /* =========================================================
       Review / checkout
    ========================================================= */

    function serviceLabel() {
      return {
        design: "Design Only",
        approve: "Design & Approve",
        manufacture: "Design, Approve & Manufacture"
      }[state.case.service];
    }

    function configTags(item) {
      const values = [];

      if (item.shade) {
        values.push("Shade " + item.shade);
      }

      if (item.material) {
        values.push(item.material);
      }

      Object.values(item.config || {}).forEach(value => {
        if (
          typeof value === "string" &&
          value.trim() &&
          !values.includes(value) &&
          value.length < 70
        ) {
          values.push(value);
        }
      });

      return values.slice(0, 8);
    }

    function openReviewModal() {
      if (!validateCaseBasics()) return;

      if (!state.case.id) {
        if (!saveCase(true)) return;
      }

      renderReviewModal();
    }

    function renderReviewModal() {
      const totals = calculateTotals();
      const payment = state.case.payment;

      openModal(`
        <section class="modal">
          <div class="modal-header">
            <h2>Review &amp; Checkout</h2>

            <button class="modal-close"
                    onclick="closeModal()">
              ×
            </button>
          </div>

          <div class="modal-body">
            <div class="review-grid">
              <div>
                <div class="review-section">
                  <h3>Case Information</h3>

                  <div class="review-item">
                    <strong>
                      ${escapeHtml(state.case.reference)}
                    </strong>

                    <small>
                      ${escapeHtml(state.case.id)}
                      ·
                      ${escapeHtml(state.case.patientName || "No patient name")}
                      ·
                      ${escapeHtml(state.case.client)}
                    </small>
                  </div>
                </div>

                <div class="review-section">
                  <h3>Prescription</h3>

                  ${state.case.items.map(item => {
                    const product =
                      PRODUCTS[item.productKey];

                    return `
                      <div class="review-item">
                        <strong>${product.label}</strong>

                        <small>
                          ${
                            item.arch ||
                            `Teeth: ${item.teeth.join(", ")}`
                          }
                          · Qty ${item.quantity}
                        </small>

                        <div style="
                          margin-top:7px;
                          display:flex;
                          flex-wrap:wrap;
                          gap:5px
                        ">
                          ${configTags(item).map(tag => `
                            <span style="
                              padding:5px 7px;
                              background:#f0f0f3;
                              border-radius:3px;
                              font-size:10px
                            ">
                              ${escapeHtml(tag)}
                            </span>
                          `).join("")}
                        </div>
                      </div>
                    `;
                  }).join("")}
                </div>

                <div class="review-section">
                  <h3>Checkout</h3>

                  <div class="payment-methods">
                    <button
                      class="payment-method
                        ${payment.method === "card" ? "selected" : ""}"
                      onclick="setPaymentMethod('card')">
                      Credit Card
                    </button>

                    <button
                      class="payment-method
                        ${payment.method === "paypal" ? "selected" : ""}"
                      onclick="setPaymentMethod('paypal')">
                      PayPal
                    </button>
                  </div>

                  ${
                    payment.method === "card"
                      ? `
                        <div class="field-group">
                          <label>Name on Card</label>

                          <input class="input"
                                 value="${escapeHtml(payment.name)}"
                                 placeholder="Prototype: enter any name"
                                 oninput="
                                   state.case.payment.name=this.value
                                 " />
                        </div>

                        <div class="field-group">
                          <label>Card Number</label>

                          <input class="input"
                                 value="${escapeHtml(payment.card)}"
                                 placeholder="4242 4242 4242 4242"
                                 oninput="
                                   state.case.payment.card=this.value
                                 " />
                        </div>

                        <div class="option-input-grid">
                          <div class="field-group">
                            <label>Expiry</label>

                            <input class="input"
                                   value="${escapeHtml(payment.expiry)}"
                                   placeholder="MM/YY"
                                   oninput="
                                     state.case.payment.expiry=this.value
                                   " />
                          </div>

                          <div class="field-group">
                            <label>CVV</label>

                            <input class="input"
                                   value="${escapeHtml(payment.cvv)}"
                                   placeholder="123"
                                   oninput="
                                     state.case.payment.cvv=this.value
                                   " />
                          </div>
                        </div>
                      `
                      : `
                        <div class="field-group">
                          <label>PayPal Email</label>

                          <input class="input"
                                 type="email"
                                 value="${escapeHtml(payment.paypalEmail)}"
                                 placeholder="paypal@example.com"
                                 oninput="
                                   state.case.payment.paypalEmail=this.value
                                 " />
                        </div>
                      `
                  }

                  <label style="
                    display:flex;
                    gap:8px;
                    align-items:flex-start;
                    font-size:12px;
                    line-height:1.45
                  ">
                    <input type="checkbox"
                           ${payment.terms ? "checked" : ""}
                           onchange="
                             state.case.payment.terms=this.checked
                           " />

                    <span>
                      I confirm that the prescription and submitted
                      digital files are correct.
                    </span>
                  </label>
                </div>
              </div>

              <aside class="review-summary">
                <h3 style="
                  margin:0 0 13px;
                  color:var(--purple)
                ">
                  Order Summary
                </h3>

                <div class="review-item">
                  <strong>${serviceLabel()}</strong>

                  <small>
                    ${
                      state.case.service === "design"
                        ? "Delivered by customer download link"
                        : state.case.service === "approve"
                          ? "Customer approval required"
                          : "Approval followed by manufacturing"
                    }
                  </small>
                </div>

                ${
                  state.case.service === "manufacture"
                    ? `
                      <div class="review-item">
                        <strong>
                          ${
                            state.case.manufactureMethod === "print"
                              ? "Print the Design"
                              : "Mill the Design"
                          }
                        </strong>

                        <small>
                          ${
                            state.case.output === "applianceModels"
                              ? "Appliance and Models"
                              : "Appliance Only"
                          }
                        </small>
                      </div>
                    `
                    : ""
                }

                ${renderPriceLines()}
              </aside>
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline"
                    onclick="openFilesModal()">
              Digital Files
            </button>

            <button class="btn btn-success"
                    onclick="submitCase()">
              ${icon("check")}
              Pay &amp; Submit
            </button>
          </div>
        </section>
      `);
    }

    function setPaymentMethod(method) {
      state.case.payment.method = method;
      renderReviewModal();
    }

    function submitCase() {
      if (!validateCaseBasics()) return;

      if (!validateFiles()) {
        openFilesModal();
        return;
      }

      const payment = state.case.payment;

      if (!payment.terms) {
        showToast("Please confirm the prescription.");
        return;
      }

      if (payment.method === "card") {
        if (
          !payment.name.trim() ||
          !payment.card.trim() ||
          !payment.expiry.trim() ||
          !payment.cvv.trim()
        ) {
          showToast("Complete the credit card fields.");
          return;
        }
      } else if (!payment.paypalEmail.trim()) {
        showToast("Enter the PayPal email.");
        return;
      }

      state.case.status = "Submitted";
      state.case.updatedAt = new Date().toISOString();

      const cases = storedCases();
      const index = cases.findIndex(
        item => item.id === state.case.id
      );

      if (index === -1) {
        cases.push(clone(state.case));
      } else {
        cases[index] = clone(state.case);
      }

      persistCases(cases);
      renderSuccessModal();
      render();
    }

    function renderSuccessModal() {
      openModal(`
        <section class="modal small">
          <div class="success-view">
            <div class="success-icon">
              ${icon("check")}
            </div>

            <h2>Case submitted successfully</h2>

            <p>
              The case has been routed according to the selected
              prescription and service.
            </p>

            <p>
              Case ID:
              <strong>${escapeHtml(state.case.id)}</strong><br>

              Service:
              <strong>${serviceLabel()}</strong>
            </p>

            <button class="btn btn-primary"
                    onclick="closeModal()">
              Return to Project
            </button>

            <button class="btn btn-outline"
                    onclick="downloadPrescription()">
              ${icon("download")}
              Download Prescription
            </button>
          </div>
        </section>
      `);
    }

    /* =========================================================
       Prescription download
    ========================================================= */

    function downloadPrescription() {
      const totals = calculateTotals();

      const lines = [
        "DENTAL CASE PRESCRIPTION",
        "========================",
        `Case ID: ${state.case.id}`,
        `Reference: ${state.case.reference}`,
        `Client: ${state.case.client}`,
        `Patient: ${state.case.patientName || "Not provided"}`,
        `Service: ${serviceLabel()}`,
        `Shade: ${state.case.shade}`,
        "",
        "ITEMS"
      ];

      state.case.items.forEach((item, index) => {
        const product = PRODUCTS[item.productKey];

        lines.push(
          `${index + 1}. ${product.label}`,
          `   Teeth / Arch: ${
            item.arch || item.teeth.join(", ")
          }`,
          `   Quantity: ${item.quantity}`,
          `   Material: ${item.material || "N/A"}`,
          `   Shade: ${item.shade || "N/A"}`,
          `   Configuration: ${JSON.stringify(item.config)}`
        );
      });

      lines.push(
        "",
        `Total: ${money(totals.total)}`
      );

      const blob = new Blob(
        [lines.join("\n")],
        { type: "text/plain" }
      );

      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");

      anchor.href = url;
      anchor.download =
        `${state.case.id || "case"}-prescription.txt`;

      document.body.appendChild(anchor);
      anchor.click();
      anchor.remove();

      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* =========================================================
       Modal and help
    ========================================================= */

    function openModal(content) {
      document.getElementById("modalRoot").innerHTML = `
        <div class="modal-backdrop"
             onclick="modalBackdropClose(event)">
          ${content}
        </div>
      `;
    }

    function closeModal() {
      document.getElementById("modalRoot").innerHTML = "";
    }

    function modalBackdropClose(event) {
      if (event.target.classList.contains("modal-backdrop")) {
        closeModal();
      }
    }

    function showHelp() {
      openModal(`
        <section class="modal small">
          <div class="modal-header">
            <h2>How to Create a Case</h2>

            <button class="modal-close"
                    onclick="closeModal()">
              ×
            </button>
          </div>

          <div class="modal-body"
               style="line-height:1.65">
            <ol>
              <li>Select a client and enter the required Reference.</li>
              <li>Click a tooth in the dental chart.</li>
              <li>
                Hold Ctrl/Cmd or activate Multi-select to choose
                additional teeth.
              </li>
              <li>Choose a product from the left panel.</li>
              <li>Select material and product-specific options.</li>
              <li>Click OK to add the prescription item.</li>
              <li>Select service and review the calculated price.</li>
              <li>Click Save.</li>
              <li>Upload required digital files.</li>
              <li>Review, complete prototype payment and submit.</li>
            </ol>

            <div class="modal-note">
              Full Denture and Bite Splint products select one complete
              arch and register as quantity one.
            </div>
          </div>

          <div class="modal-footer">
            <button class="btn btn-primary"
                    onclick="closeModal()">
              Got It
            </button>
          </div>
        </section>
      `);
    }

    /* =========================================================
       Start
    ========================================================= */

    render();
  </script>
</body>
</html>
