<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dental Case Creation</title>
  <style>
    :root {
      --primary: #0b5394;
      --primary-dark: #073763;
      --primary-soft: #e8f0fa;
      --accent: #c95f28;
      --accent-soft: #fdf0e8;
      --green: #16845c;
      --red: #c52e47;
      --yellow: #ffae1a;
      --text: #2c2c33;
      --muted: #7a7a82;
      --border: #d4d4da;
      --panel: #fff;
      --page: #f6f7fb;
      --shadow: 0 2px 8px rgba(11,83,148,0.10);
      --radius: 5px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 1180px;
      height: 100%;
      overflow: hidden;
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background: var(--page);
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: 0.35; cursor: not-allowed; }
    svg { display: block; }

    .app { height: 100vh; display: flex; flex-direction: column; }

    /* ===== Buttons / Fields ===== */
    .btn {
      min-height: 38px; padding: 7px 15px; border: 1px solid transparent;
      border-radius: 3px; display: inline-flex; align-items: center;
      justify-content: center; gap: 7px; background: white;
      color: var(--primary); font-weight: 650;
    }
    .btn svg { width: 20px; height: 20px; }
    .btn-outline { border-color: var(--primary); }
    .btn-primary { color: white; border-color: var(--primary); background: var(--primary); }
    .btn-success { color: white; border-color: var(--green); background: var(--green); }
    .btn-danger { color: white; border-color: var(--red); background: var(--red); }
    .btn-small { min-height: 32px; padding: 5px 10px; font-size: 12px; }

    .icon-button {
      width: 36px; height: 36px; padding: 5px; border: 0;
      color: var(--primary); background: transparent; display: grid; place-items: center;
    }
    .icon-button svg { width: 23px; height: 23px; }

    .field-group { margin-bottom: 15px; }
    .field-group label { display: block; margin-bottom: 5px; color: #555; font-size: 13px; font-weight: 650; }

    .input, .select, .textarea {
      width: 100%; border: 1px solid #888; border-radius: 2px;
      outline: none; background: white; color: var(--text);
    }
    .input, .select { height: 42px; padding: 0 11px; }
    .textarea { min-height: 110px; resize: vertical; padding: 11px; }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(11,83,148,0.12);
    }
    .required { color: #d8394d; }
    .muted { color: var(--muted); }

    /* ===== Header ===== */
    .topbar {
      height: 102px; flex: 0 0 102px;
      display: grid; grid-template-columns: 39% 41% 20%;
      align-items: center; padding: 15px 28px;
      background: white; border-bottom: 2px solid var(--primary);
      z-index: 10;
    }
    .topbar.config-header { grid-template-columns: 39% 20% 41%; }
    .header-left, .header-center, .header-right {
      display: flex; align-items: center; min-width: 0;
    }
    .header-left { gap: 18px; }
    .header-center { justify-content: center; }
    .header-right { justify-content: flex-end; gap: 16px; }

    .page-title, .center-title, .right-title {
      color: var(--primary); font-weight: 300; line-height: 1;
    }
    .page-title { font-size: 41px; white-space: nowrap; }
    .center-title { font-size: 41px; text-align: center; }
    .right-title { margin-right: auto; font-size: 40px; }

    .header-buttons { margin-left: auto; display: flex; gap: 12px; }
    .header-button {
      min-width: 80px; height: 37px; padding: 5px 11px;
      border: 1px solid var(--primary); border-radius: 3px;
      background: white; color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      gap: 6px; font-size: 13px; font-weight: 650;
    }
    .header-button:hover { background: var(--primary-soft); }
    .header-button svg { width: 20px; height: 20px; }

    .back-button { width: 48px; height: 48px; padding: 5px; border: 0; color: var(--primary); background: transparent; }
    .back-button svg { width: 39px; height: 39px; }

    .tooth-header { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .header-subtitle { color: #555; font-size: 16px; white-space: nowrap; }

    /* ===== Layout ===== */
    .workbench {
      height: calc(100vh - 102px); min-height: 0;
      display: grid; grid-template-columns: 39% 41% 20%;
      padding: 11px 27px 25px;
      background: linear-gradient(90deg, #f6f7fb 0%, #ffffff 45%, #f6f7fb 100%);
    }
    .workbench.config-layout { grid-template-columns: 39% 20% 41%; }

    .left-panel, .center-panel, .right-panel { min-width: 0; min-height: 0; }
    .left-panel { padding-right: 27px; overflow-y: auto; }
    .center-panel { position: relative; overflow: hidden; }
    .right-panel {
      position: relative; padding-left: 27px;
      border-left: 1px solid #eaeaea; overflow-y: auto;
    }
    .config-layout .center-panel { padding: 0 20px 0 7px; overflow-y: auto; }
    .config-layout .right-panel { padding: 0 17px 20px 28px; }

    /* ===== Helpers ===== */
    .flow-help {
      min-height: 38px; margin: 4px 7px 11px; padding: 8px 10px;
      display: flex; align-items: center; gap: 8px;
      color: var(--accent); font-size: 14px; font-weight: 650;
    }
    .flow-help svg { width: 19px; height: 19px; flex: 0 0 auto; }
    .screen-help {
      margin: 7px 0 12px; padding: 10px 12px;
      color: #705225; background: #fff8df;
      border: 1px solid #f0d99e; border-radius: 3px;
      font-size: 13px; line-height: 1.4;
    }

    /* ===== Project panel ===== */
    .panel-card {
      margin-bottom: 19px; overflow: hidden;
      border-radius: var(--radius); background: white;
      box-shadow: var(--shadow);
    }
    .project-date-row {
      min-height: 57px; padding: 0 20px;
      display: flex; align-items: center; gap: 11px;
      border-bottom: 1px solid #bbb; color: #555; font-size: 17px;
    }
    .project-date-row svg { width: 19px; height: 19px; }
    .due-label { margin-left: auto; color: var(--accent); font-weight: 700; }
    .project-form { padding: 28px 20px 18px; }
    .project-form-grid {
      display: grid; grid-template-columns: minmax(0, 1fr) 180px;
      gap: 15px; margin-bottom: 24px;
    }
    .project-form-full { margin-bottom: 24px; }

    .floating-field {
      min-height: 42px; position: relative;
      border: 1px solid #888; border-radius: 2px; background: white;
    }
    .floating-field label {
      position: absolute; top: -10px; left: 10px;
      padding: 0 5px; color: #555; background: white; font-size: 13px;
      font-weight: 650;
    }
    .floating-field input, .floating-field select {
      width: 100%; height: 40px; padding: 8px 10px;
      border: 0; outline: none; background: transparent; color: #333;
    }
    .floating-field input[disabled], .floating-field select[disabled] {
      background: #f0f4f8; color: #666; cursor: default;
    }

    .notes-head, .preview-head {
      min-height: 58px; padding: 0 20px;
      display: flex; align-items: center; gap: 9px;
      border-bottom: 1px solid #bbb; color: #555; font-weight: 650;
    }
    .notes-head svg, .preview-head svg { width: 20px; height: 20px; }
    .notes-head .expand-icon { margin-left: auto; }
    .notes-body { padding: 20px; }
    .notes-body textarea {
      width: 100%; height: 285px; padding: 13px;
      resize: none; border: 1px solid #888; border-radius: 3px; outline: none;
    }
    .preview-tabs {
      min-height: 56px; padding: 0 20px;
      display: flex; align-items: center; gap: 24px;
      border-bottom: 1px solid #888; color: #888; font-size: 14px; font-weight: 650;
    }
    .preview-tab { min-height: 56px; display: flex; align-items: center; gap: 7px; }
    .preview-tab.active { color: #555; border-bottom: 3px solid var(--accent); }
    .preview-tab svg { width: 19px; height: 19px; }
    .preview-body { min-height: 69px; padding: 22px 20px; font-size: 15px; }

    /* ===== Dental chart ===== */
    .chart-area {
      height: 100%; display: flex; flex-direction: column;
      align-items: flex-start; position: relative;
    }
    .chart-toolbar {
      width: 100%; min-height: 40px;
      display: flex; align-items: center; justify-content: center; gap: 13px;
      color: var(--primary); font-size: 15px; font-weight: 700;
    }
    .toggle {
      width: 33px; height: 16px; padding: 0; position: relative;
      border: 0; border-radius: 20px; background: #b0b0b8;
    }
    .toggle::after {
      content: ""; position: absolute; left: 0; top: -1px;
      width: 18px; height: 18px; border-radius: 50%;
      background: var(--primary); transition: 0.18s ease;
    }
    .toggle.on::after { left: 16px; }

    .chart-with-options {
      display: flex; align-items: flex-start; gap: 14px; flex: 1; min-height: 0;
    }
    .chart-svg-wrap { position: relative; flex: 0 0 auto; }
    .dental-chart {
      width: 380px; height: auto;
      max-height: calc(100vh - 220px);
    }
    .tooth { cursor: pointer; outline: none; }
    .tooth-body {
      fill: var(--tooth-fill, #d4d4d6); stroke: #444; stroke-width: 1.1; transition: 0.16s ease;
    }
    .tooth:hover .tooth-body { filter: brightness(0.91); stroke-width: 1.8; }
    .tooth-groove { fill: none; stroke: #4a4a4a; stroke-width: 1.05; stroke-linecap: round; }
    .tooth text {
      fill: var(--tooth-text, #111); text-anchor: middle;
      dominant-baseline: middle; font-size: 15px; pointer-events: none;
    }
    .chart-legend {
      position: absolute; left: 50%; top: 390px;
      min-width: 200px; display: grid; gap: 4px; font-size: 20px;
    }
    .legend-row { display: flex; align-items: center; gap: 8px; }
    .legend-color { width: 17px; height: 17px; flex: 0 0 auto; }

    .chart-side-options { flex: 1; padding-top: 10px; overflow-y: auto; }
    .side-option-label {
      display: block; font-size: 12px; font-weight: 700;
      color: #555; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .side-option-select {
      width: 100%; height: 38px; padding: 0 10px;
      border: 1px solid #888; border-radius: 2px; background: white;
      color: var(--text); font-size: 13px; margin-bottom: 14px; outline: none;
    }
    .side-option-select:focus { border-color: var(--primary); }
    .courier-notice {
      padding: 11px 12px; background: #e8f4fd;
      border: 1px solid #9dc3e6; border-radius: 4px;
      font-size: 12px; line-height: 1.55; color: #0b4a7c; margin-bottom: 10px;
    }
    .courier-notice strong { display: block; margin-bottom: 4px; font-size: 13px; }

    /* ===== Product catalogue ===== */
    .catalog { padding: 0 12px 20px; }
    .catalog-selected {
      margin: 5px 0 10px; padding: 9px 11px;
      color: var(--primary); background: var(--primary-soft);
      border-left: 4px solid var(--primary); font-size: 13px; line-height: 1.4;
    }
    .category { margin-bottom: 10px; }
    .category-title { margin-bottom: 4px; color: #444; font-size: 17px; }
    .product-grid {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px;
    }
    .product-button {
      min-height: 48px; padding: 6px 9px; border: 0; border-radius: 2px;
      display: flex; align-items: center; gap: 7px;
      color: white; background: var(--product-color);
      text-align: left; font-size: 12px; font-weight: 700; line-height: 1.1;
    }
    .product-button:hover { filter: brightness(1.07); }
    .product-button.selected { outline: 4px solid #f29065; outline-offset: -4px; }
    .product-button svg { width: 35px; height: 28px; flex: 0 0 auto; }

    /* ===== Material cards ===== */
    .material-pane-title, .options-pane-title {
      margin: 0 0 9px; color: var(--primary); font-size: 36px; font-weight: 300;
    }
    .material-grid {
      display: grid; grid-template-columns: repeat(2, minmax(125px, 155px)); gap: 12px;
    }
    .material-card {
      width: 100%; height: 137px; padding: 5px; position: relative; overflow: hidden;
      border: 1px solid #ddd; border-radius: 3px; background: #fafafa;
      box-shadow: 0 1px 3px rgba(0,0,0,.18); text-align: left; cursor: pointer;
    }
    .material-card.selected { padding: 2px; border: 4px solid var(--accent); }
    .material-card.selected::before {
      content: ""; position: absolute; right: 0; top: 0; z-index: 2;
      width: 29px; height: 29px; background: var(--accent);
      clip-path: polygon(0 0, 100% 0, 100% 100%);
    }
    .material-card.selected::after {
      content: "✓"; position: absolute; right: 2px; top: -5px; z-index: 3;
      color: white; font-size: 21px; font-weight: 800;
    }
    .material-card svg { width: 100%; height: 101px; }
    .material-name {
      position: absolute; left: 7px; bottom: 8px; max-width: 140px;
      color: #333; font-size: 12px; font-weight: 750; line-height: 1.1;
    }

    /* ===== Options panel ===== */
    .options-content { padding-bottom: 90px; }
    .option-section { margin-bottom: 18px; }
    .option-section h3 { margin: 0 0 7px; color: #59595e; font-size: 18px; font-weight: 450; }
    .option-note { margin: -2px 0 8px; color: var(--muted); font-size: 12px; line-height: 1.4; }
    .option-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 7px; }
    .option-button {
      min-height: 46px; padding: 7px 11px; position: relative;
      border: 1px solid #aaa; color: white;
      background: var(--option-color, var(--primary));
      text-align: left; font-size: 13px; font-weight: 700; line-height: 1.15;
    }
    .option-button.selected { outline: 4px solid var(--accent); outline-offset: -4px; }
    .option-button.selected::after {
      content: "✓"; position: absolute; right: 7px; top: 3px; font-size: 19px; font-weight: 800;
    }
    .option-input-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .shape-grid { display: grid; grid-template-columns: repeat(3, minmax(125px, 1fr)); gap: 9px; }
    .shape-card {
      min-height: 132px; padding: 8px; border: 2px solid var(--border); border-radius: 3px;
      background: white; color: var(--primary); font-size: 12px; font-weight: 700; text-align: center;
    }
    .shape-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px #ffd2bf; }
    .shape-card svg { width: 100%; height: 88px; margin-bottom: 5px; }

    .config-actions {
      position: sticky; bottom: 0; z-index: 8; padding: 13px 0 2px;
      display: flex; justify-content: flex-end; gap: 28px;
      background: linear-gradient(to bottom, rgba(250,250,250,0), rgba(250,250,250,.97) 25%);
    }
    .config-action { width: 160px; height: 60px; border-radius: 3px; font-size: 18px; font-weight: 700; }
    .config-clear { border: 1px solid #aca4bd; color: #a39bb4; background: white; }
    .config-ok { border: 1px solid var(--primary); color: white; background: var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,.2); }

    /* ===== Right prescription panel ===== */
    .action-list { margin-bottom: 17px; }
    .action-item {
      min-height: 60px; padding: 0 11px;
      display: flex; align-items: center; gap: 16px;
      border-bottom: 1px solid #bbb; color: #888;
      background: transparent; cursor: pointer;
    }
    .action-item.active { color: #444; background: #e2e8f0; border-bottom-color: transparent; }
    .action-item.disabled { color: #bbb; cursor: not-allowed; }
    .action-icon { width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; }
    .action-icon svg { width: 34px; height: 34px; }
    .action-primary { color: #2e6fbd; }
    .action-yellow { color: #d4a020; }
    .action-lilac { color: #9b9ab4; }
    .action-green { color: #60b060; }
    .action-blue { color: #5577cc; }

    .prescription-summary {
      margin-top: 13px; padding: 14px; border: 1px solid #ddd;
      background: white; box-shadow: 0 1px 4px rgba(0,0,0,.10);
    }
    .prescription-summary h3 { margin: 0 0 12px; color: var(--primary); font-size: 17px; }
    .empty-prescription { padding: 13px 0; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .rx-item { padding: 10px 0; border-bottom: 1px solid #e1e1e1; }
    .rx-item:last-child { border-bottom: 0; }
    .rx-head { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: start; }
    .rx-color { width: 10px; height: 37px; border-radius: 2px; }
    .rx-copy strong, .rx-copy small { display: block; }
    .rx-copy strong { font-size: 13px; }
    .rx-copy small { margin-top: 3px; color: var(--muted); font-size: 11px; line-height: 1.35; }
    .rx-actions { display: flex; gap: 3px; }
    .rx-action { width: 25px; height: 25px; padding: 3px; border: 0; background: transparent; color: var(--primary); }
    .rx-action.delete { color: var(--red); }
    .rx-action svg { width: 17px; height: 17px; }

    .service-box { margin-top: 13px; padding-top: 12px; border-top: 1px solid #ccc; }
    .service-box label { display: block; margin: 0 0 5px; color: #555; font-size: 12px; font-weight: 700; }
    .service-box select {
      width: 100%; height: 36px; margin-bottom: 9px; border: 1px solid #888;
      background: white; padding: 0 8px;
    }
    .price-lines { margin-top: 10px; }
    .price-line {
      padding: 4px 0; display: flex; justify-content: space-between;
      gap: 8px; color: #555; font-size: 12px;
    }
    .price-line.total {
      margin-top: 6px; padding-top: 9px; border-top: 2px solid #ddd;
      color: var(--primary); font-size: 17px; font-weight: 800;
    }

    /* ===== Modals ===== */
    .modal-backdrop {
      position: fixed; inset: 0; z-index: 100;
      display: grid; place-items: center; padding: 24px;
      background: rgba(15,35,60,0.55);
    }
    .modal {
      width: min(960px, 96vw); max-height: 91vh; overflow-y: auto;
      border-radius: 6px; background: white;
      box-shadow: 0 18px 60px rgba(0,0,0,.30);
    }
    .modal.small { width: min(650px, 95vw); }
    .modal-header {
      min-height: 68px; padding: 0 21px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .modal-header h2 { margin: 0; color: var(--primary); font-size: 27px; font-weight: 400; }
    .modal-close { width: 35px; height: 35px; border: 0; color: #777; background: transparent; font-size: 27px; }
    .modal-body { padding: 21px; }
    .modal-footer {
      min-height: 72px; padding: 13px 21px;
      display: flex; align-items: center; justify-content: flex-end; gap: 12px;
      border-top: 1px solid var(--border); background: #fafafa;
    }
    .modal-note {
      margin-bottom: 15px; padding: 11px 13px;
      color: #65501e; background: #fff8dc; border: 1px solid #ecd795; border-radius: 4px;
      font-size: 13px; line-height: 1.45;
    }
    .upload-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .upload-card {
      min-height: 142px; padding: 14px;
      display: flex; flex-direction: column; justify-content: space-between;
      border: 2px dashed #c5c5cb; border-radius: 5px; background: #fbfbfc;
    }
    .upload-card.complete { border-style: solid; border-color: var(--green); background: #edf9f4; }
    .upload-card h4 { margin: 0 0 5px; color: var(--primary); font-size: 15px; }
    .upload-card p { margin: 0; color: var(--muted); font-size: 11px; }
    .upload-status { float: right; color: var(--red); font-size: 10px; font-weight: 800; text-transform: uppercase; }
    .upload-status.optional { color: var(--muted); }
    .upload-file-list { margin: 9px 0 0; color: var(--green); font-size: 11px; line-height: 1.4; }
    .file-input { display: none; }
    .upload-label {
      min-height: 35px; margin-top: 10px;
      display: flex; align-items: center; justify-content: center; gap: 7px;
      border: 1px solid var(--primary); border-radius: 3px;
      color: var(--primary); background: white; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .upload-label svg { width: 18px; height: 18px; }

    .courier-modal-notice {
      padding: 24px; text-align: center;
    }
    .courier-modal-notice h3 { color: var(--primary); margin-bottom: 12px; }
    .courier-modal-notice p { color: var(--muted); line-height: 1.6; margin-bottom: 8px; }
    .courier-address {
      display: inline-block; padding: 14px 20px; margin: 12px 0;
      background: var(--primary-soft); border: 1px solid #9dc3e6;
      border-radius: 4px; font-size: 14px; font-weight: 700; color: var(--primary);
      line-height: 1.7; text-align: left;
    }

    .review-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; }
    .review-section { margin-bottom: 16px; padding: 16px; border: 1px solid var(--border); border-radius: 4px; }
    .review-section h3 { margin: 0 0 12px; color: var(--primary); font-size: 18px; }
    .review-item { padding: 11px 0; border-bottom: 1px solid #e3e3e5; }
    .review-item:last-child { border-bottom: 0; }
    .review-item strong, .review-item small { display: block; }
    .review-item small { margin-top: 4px; color: var(--muted); }
    .review-summary { padding: 16px; border: 1px solid var(--border); border-radius: 4px; background: #fafafa; }

    .payment-methods { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
    .payment-method {
      min-height: 67px; border: 2px solid var(--border);
      color: var(--primary); background: white; font-weight: 750;
    }
    .payment-method.selected { border-color: var(--primary); background: var(--primary-soft); }

    .load-list { display: grid; gap: 10px; }
    .load-item {
      padding: 14px; display: grid; grid-template-columns: 1fr auto;
      align-items: center; gap: 15px;
      border: 1px solid var(--border); border-radius: 4px;
    }
    .load-item strong, .load-item small { display: block; }
    .load-item small { margin-top: 4px; color: var(--muted); }

    .success-view { padding: 30px; text-align: center; }
    .success-icon {
      width: 80px; height: 80px; margin: 0 auto 17px;
      display: grid; place-items: center; border-radius: 50%;
      color: white; background: var(--green);
    }
    .success-icon svg { width: 42px; height: 42px; }
    .success-view h2 { color: var(--primary); font-weight: 400; }
    .success-view p { color: var(--muted); line-height: 1.55; }

    /* ===== Toast ===== */
    .toast {
      min-width: 300px; max-width: 650px; padding: 13px 19px;
      position: fixed; left: 50%; bottom: 28px; z-index: 200;
      border-radius: 4px; color: white; background: var(--primary-dark);
      box-shadow: 0 8px 25px rgba(0,0,0,.25); text-align: center;
      opacity: 0; pointer-events: none;
      transform: translate(-50%, 100px); transition: 0.25s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 1350px) {
      .page-title, .center-title, .right-title { font-size: 32px; }
      .product-button { font-size: 11px; }
      .chart-legend { font-size: 17px; }
    }
  </style>
</head>

    /* =========================================================

      castPartial:"SK", acrylicPartial:"SK",

    function generateReference() {
      const firstItem = state.case.items.find(item => PRODUCTS[item.productKey].flow !== "marker");
      const prefix = firstItem ? (REFERENCE_PREFIXES[firstItem.productKey] || "SC") : "SC";
      const key = "sbRefCounter_" + prefix;
      let counter = parseInt(localStorage.getItem(key) || "0") + 1;
      if (counter > 300) counter = 1;
      localStorage.setItem(key, String(counter));
      return prefix + counter;
    }

    /* =========================================================

    function escapeHtml(v="") {
      return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function clone(v) { return JSON.parse(JSON.stringify(v)); }
    function money(v) { return new Intl.NumberFormat("en-AU",{style:"currency",currency:"AUD"}).format(Number(v||0)); }

      return new Date().toLocaleString([],{year:"numeric",month:"2-digit",day:"2-digit",hour:"numeric",minute:"2-digit"});
    }

      const t=document.getElementById("toast");
      t.textContent=msg; t.classList.add("show");
      clearTimeout(window._toastTimer);
      window._toastTimer=setTimeout(()=>t.classList.remove("show"),2800);

    function calculateTotals() {
      const design=state.case.items.reduce((sum,item)=>sum+item.unitPrice*item.quantity,0);
      const approval=state.case.service==="design"?0:35;
      const manufacturing=state.case.service==="manufacture"?state.case.items.reduce((sum,item)=>{if(PRODUCTS[item.productKey].flow==="marker")return sum;return sum+(state.case.manufactureMethod==="print"?58:72)*item.quantity;},0):0;
      const output=state.case.service==="manufacture"&&state.case.output==="applianceModels"?45:0;
      const modelService=state.case.modelService==="design"?25:state.case.modelService==="designPrint"?62:0;
      return {design,approval,manufacturing,output,modelService,total:design+approval+manufacturing+output+modelService};
    }

      const t=calculateTotals();
      return `

          ${t.manufacturing?`<div class="price-line"><span>${state.case.manufactureMethod==="print"?"3D Print":"Mill"}</span><strong>${money(t.manufacturing)}</strong></div>`:""}

    /* =========================================================
       Tooth interactions
    ========================================================= */
    function toothClick(number,event) {
      if (state.screen==="project") {
        state.currentTooth=number; state.workingTeeth=[number];
        state.selectedArch=""; state.activeProductKey=null;
        state.selectedMaterial=null; state.workingConfig={};
        state.editingItemId=null; state.screen="catalog";
        render(); return;
      }
      const product=state.activeProductKey?PRODUCTS[state.activeProductKey]:null;
      if (product&&product.mode==="arch") {
        const upper=UPPER_TEETH.includes(number);
        state.workingTeeth=upper?[...UPPER_TEETH]:[...LOWER_TEETH];
        state.selectedArch=upper?"Upper Arch":"Lower Arch";
        state.currentTooth=number; render(); return;
      }
      const useMulti=state.multiSelect||event.ctrlKey||event.metaKey;
      if (useMulti) { if(state.workingTeeth.includes(number)) state.workingTeeth=state.workingTeeth.filter(t=>t!==number); else state.workingTeeth.push(number); }
      else state.workingTeeth=[number];
      state.currentTooth=number; state.selectedArch="";
      state.workingTeeth.sort((a,b)=>a-b); render();
    }

    function toggleMultiSelect() { state.multiSelect=!state.multiSelect; render(); }

    function chooseProduct(productKey) {
      if (!state.workingTeeth.length) { showToast("Select at least one tooth first."); return; }
      const product=PRODUCTS[productKey];
      state.activeProductKey=productKey;
      state.workingConfig=defaultConfig(productKey);
      state.selectedMaterial=null; state.editingItemId=null;
      if (product.mode==="arch") {
        const upper=UPPER_TEETH.includes(state.currentTooth);
        state.workingTeeth=upper?[...UPPER_TEETH]:[...LOWER_TEETH];
        state.selectedArch=upper?"Upper Arch":"Lower Arch";
      }
      if (product.flow==="marker") { commitMarkerItem(productKey); return; }
      // Skip material selection if no materials for this group
      const groupName = getProductGroup(productKey);
      const hasMaterials = (MATERIALS_BY_GROUP[groupName]||[]).length > 0;
      if (!hasMaterials) { state.selectedMaterial = ""; state.screen="material"; render(); return; }
      state.screen="material"; render();
    }

    function selectMaterial(encodedName) { state.selectedMaterial=decodeURIComponent(encodedName); render(); }
    function setWorkingOption(field,encodedValue) { state.workingConfig[field]=decodeURIComponent(encodedValue); render(); }
    function clearWorkingConfiguration() { if(!state.activeProductKey)return; state.workingConfig=defaultConfig(state.activeProductKey); state.selectedMaterial=null; render(); }
    function itemQuantity(product) { if(product.quantity==="one")return 1; return state.workingTeeth.length; }

    function commitMarkerItem(productKey) {
      const product=PRODUCTS[productKey];
      state.case.items.push({id:"item-"+Date.now()+"-"+Math.random().toString(16).slice(2),productKey,teeth:[...state.workingTeeth],arch:state.selectedArch,quantity:itemQuantity(product),unitPrice:product.price,material:"",shade:state.case.shade,config:{}});
      resetWorkingState(); state.screen="project"; state.case.status="Unsaved Changes";
      showToast(product.label+" added."); render();
    }

    function commitPrescriptionItem() {
      if (!state.activeProductKey) { showToast("Select a product."); return; }
      if (!state.workingTeeth.length) { showToast("Select at least one tooth."); return; }
      const groupName = getProductGroup(state.activeProductKey);
      const hasMaterials = (MATERIALS_BY_GROUP[groupName]||[]).length > 0;
      if (hasMaterials && !state.selectedMaterial) { showToast("Select a material."); return; }
      const product=PRODUCTS[state.activeProductKey];
      const item={id:state.editingItemId||("item-"+Date.now()+"-"+Math.random().toString(16).slice(2)),productKey:state.activeProductKey,teeth:[...state.workingTeeth],arch:state.selectedArch,quantity:itemQuantity(product),unitPrice:product.price,material:state.selectedMaterial||"",shade:state.case.shade,config:clone(state.workingConfig)};
      if (state.editingItemId) { const idx=state.case.items.findIndex(e=>e.id===state.editingItemId); if(idx!==-1)state.case.items[idx]=item; }
      else state.case.items.push(item);
      const wasEditing=Boolean(state.editingItemId);
      resetWorkingState(); state.screen="project"; state.case.status="Unsaved Changes";
      showToast(wasEditing?"Prescription item updated.":"Prescription item added."); render();
    }

    function resetWorkingState() { state.workingTeeth=[]; state.selectedArch=""; state.activeProductKey=null; state.selectedMaterial=null; state.workingConfig={}; state.editingItemId=null; state.multiSelect=false; }

    function editPrescriptionItem(itemId) {
      const item=state.case.items.find(e=>e.id===itemId);
      if(!item)return;
      state.editingItemId=item.id; state.activeProductKey=item.productKey;
      state.workingTeeth=[...item.teeth]; state.selectedArch=item.arch||"";
      state.currentTooth=item.teeth[0]||14; state.selectedMaterial=item.material;
      state.workingConfig=clone(item.config); state.screen="material"; render();
    }

    function removePrescriptionItem(itemId) { state.case.items=state.case.items.filter(item=>item.id!==itemId); state.case.status="Unsaved Changes"; render(); showToast("Prescription item removed."); }

    function openPrescriptionDesigner() {
      if (state.case.items.length) { const editable=state.case.items.find(item=>PRODUCTS[item.productKey].flow!=="marker"); if(editable){editPrescriptionItem(editable.id);return;} }
      showToast("Click a tooth in the dental chart to start.");
    }

    function goBack() {
      if (state.screen==="material") { state.screen="catalog"; state.selectedMaterial=null; render(); return; }
      if (state.screen==="catalog") { resetWorkingState(); state.screen="project"; render(); }
    }

    /* =========================================================
       Service
    ========================================================= */
    function setService(v) { state.case.service=v; render(); }
    function setManufactureMethod(v) { state.case.manufactureMethod=v; render(); }
    function setOutput(v) { state.case.output=v; render(); }
    function setModelService(v) { state.case.modelService=v; render(); }
    function focusCaseSetup() { document.getElementById("leftPanel").scrollTo({top:0,behavior:"smooth"}); showToast("Enter patient name and due date before saving."); }

    /* =========================================================
       Save / New / Load
    ========================================================= */
    function validateCaseBasics() {
      if (!state.case.patientName.trim()) { showToast("Patient name is required."); return false; }
      if (!state.case.dueDate) { showToast("Due date is required."); return false; }
      if (!primaryItems().length) { showToast("Add at least one billable product."); return false; }
      return true;
    }

    function saveCase(silent=false) {
      if (!validateCaseBasics()) return false;
      if (!state.case.id) { state.case.id=createCaseId(); state.case.createdAt=new Date().toISOString(); }
      state.case.updatedAt=new Date().toISOString();
      if (state.case.status!=="Submitted") state.case.status="Draft";
      const cases=storedCases();
      const index=cases.findIndex(item=>item.id===state.case.id);
      if(index===-1)cases.push(clone(state.case)); else cases[index]=clone(state.case);
      persistCases(cases);
      if (!silent) showToast(state.case.id+" saved successfully.");
      render(); return true;
    }

    function newCase() {
      if(state.case.items.length&&!confirm("Start a new case? Unsaved changes may be lost."))return;
      state.case=newCaseData(); state.screen="project"; state.currentTooth=14;
      resetWorkingState(); closeModal(); render(); showToast("New case created.");
    }

    function openLoadModal() {
      const cases=storedCases().sort((a,b)=>new Date(b.updatedAt)-new Date(a.updatedAt));
      openModal(`
        <section class="modal small">
          <div class="modal-header"><h2>Load Case</h2><button class="modal-close" onclick="closeModal()">×</button></div>
          <div class="modal-body">
            ${cases.length?`<div class="load-list">${cases.map(c=>`<div class="load-item"><div><strong>${escapeHtml(c.reference||c.id)}</strong><small>${escapeHtml(c.id)} · ${escapeHtml(c.patientName||"No patient name")} · ${escapeHtml(c.status)}</small></div><button class="btn btn-outline btn-small" onclick="loadCase('${c.id}')">Load</button></div>`).join("")}</div>`:`<div class="muted" style="padding:35px;text-align:center">No saved cases found.</div>`}
          </div>
        </section>`);
    }

    function loadCase(caseId) {
      const c=storedCases().find(item=>item.id===caseId);
      if(!c)return;
      state.case=clone(c); state.screen="project";
      resetWorkingState(); closeModal(); render(); showToast(caseId+" loaded.");
    }

    /* =========================================================
       Digital files
    ========================================================= */
    function getProtocolFields() {
      const fields=new Map();
      state.case.items.forEach(item=>{
        const protocolKey=PRODUCTS[item.productKey].protocol;
        const protocol=PROTOCOLS[protocolKey]||[];
        protocol.forEach(field=>{ if(!fields.has(field.id))fields.set(field.id,clone(field)); else if(field.required)fields.get(field.id).required=true; });
      });
      return [...fields.values()];
    }

    function openFilesModal() {
      if (!state.case.items.length) { showToast("Add prescription items first."); return; }
      if (state.case.impressionType==="Traditional Impression") {
        openModal(`
          <section class="modal small">
            <div class="modal-header"><h2>Courier Service</h2><button class="modal-close" onclick="closeModal()">×</button></div>
            <div class="modal-body">
              <div class="courier-modal-notice">
                <div style="font-size:48px;margin-bottom:12px">📦</div>
                <h3>Traditional Impression Selected</h3>
                <p>No digital scan files are required. Please send your physical impressions to our lab via courier service.</p>
                <div class="courier-address">
                  SmileBright Dental Lab<br>
                  Unit 4, 12 Industrial Drive<br>
                  Sydney NSW 2000<br>
                  Australia<br>
                  <br>
                  Tel: (02) 9000 0000<br>
                  lab@smilebright.com.au
                </div>
                <p style="font-size:12px;margin-top:8px">Please include a printed copy of your prescription with your impressions. You may proceed directly to Review &amp; Checkout.</p>
              </div>
            </div>
            <div class="modal-footer">
              <button class="btn btn-outline" onclick="closeModal()">Close</button>
              <button class="btn btn-primary" onclick="closeModal();openReviewModal()">Proceed to Review</button>
            </div>
          </section>`);
        return;
      }
      renderFilesModal();
    }

    function renderFilesModal() {
      const fields=getProtocolFields();
      openModal(`
        <section class="modal">
          <div class="modal-header"><h2>Digital Submission Protocol</h2><button class="modal-close" onclick="closeModal()">×</button></div>
          <div class="modal-body">
            <div class="modal-note">Upload the required upper arch, lower arch and bite scan. Full denture cases also require clinical photos or a face scan. This prototype stores file names only.</div>
            <div class="upload-grid">
              ${fields.map(field=>{const files=state.case.uploads[field.id]||[];return `<div class="upload-card ${files.length?"complete":""}"><div><span class="upload-status ${field.required?"":"optional"}">${field.required?"Required":"Optional"}</span><h4>${field.label}</h4><p>${field.accept}</p>${files.length?`<div class="upload-file-list">${files.map(f=>"✓ "+escapeHtml(f.name)).join("<br>")}</div>`:""}</div><input class="file-input" id="upload-${field.id}" type="file" multiple accept="${field.accept}" onchange="handleUpload('${field.id}',this.files)"/><label class="upload-label" for="upload-${field.id}">${icon("upload")} ${files.length?"Add / Replace Files":"Choose Files"}</label></div>`;}).join("")}
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeModal()">Close</button>
            <button class="btn btn-primary" onclick="validateFilesAndReview()">Review Case</button>
          </div>
        </section>`);
    }

    function handleUpload(fieldId,fileList) {
      state.case.uploads[fieldId]=[...fileList].map(f=>({name:f.name,size:f.size,type:f.type}));
      renderFilesModal(); showToast("Files attached.");
    }

    function validateFiles(showMessage=true) {
      if (state.case.impressionType==="Traditional Impression") return true;
      const fields=getProtocolFields();
      const missing=fields.filter(f=>f.required&&!(state.case.uploads[f.id]||[]).length);
      if(missing.length){if(showMessage)showToast("Missing required files: "+missing.map(f=>f.label).join(", "));return false;}
      const hasDenture=state.case.items.some(item=>PRODUCTS[item.productKey].flow==="denture");
      if(hasDenture){const photoIds=["frontSmile","leftSmile","rightSmile","frontRetracted"];const hasPhotos=photoIds.some(id=>(state.case.uploads[id]||[]).length);const hasFaceScan=(state.case.uploads.faceScanRetractors||[]).length||(state.case.uploads.faceScanNoRetractors||[]).length;if(!hasPhotos&&!hasFaceScan){if(showMessage)showToast("Full denture cases require photos or a face scan.");return false;}}
      return true;
    }

    function validateFilesAndReview() { if(!validateFiles())return; openReviewModal(); }

    /* =========================================================
       Review / checkout
    ========================================================= */
    function serviceLabel() { return {design:"Design Only",approve:"Design & Approve",manufacture:"Design, Approve & Manufacture"}[state.case.service]; }

    function configTags(item) {
      const values=[];
      if(item.shade)values.push("Shade "+item.shade);
      if(item.material)values.push(item.material);
      Object.values(item.config||{}).forEach(v=>{if(typeof v==="string"&&v.trim()&&!values.includes(v)&&v.length<70)values.push(v);});
      return values.slice(0,8);
    }

    function openReviewModal() {
      if(!validateCaseBasics())return;
      if(!state.case.id){if(!saveCase(true))return;}
      renderReviewModal();
    }

    function renderReviewModal() {
      const totals=calculateTotals();
      const payment=state.case.payment;
      openModal(`
        <section class="modal">
          <div class="modal-header"><h2>Review &amp; Checkout</h2><button class="modal-close" onclick="closeModal()">×</button></div>
          <div class="modal-body">
            <div class="review-grid">
              <div>
                <div class="review-section">
                  <h3>Case Information</h3>
                  <div class="review-item">
                    <strong>${escapeHtml(state.case.patientName)}</strong>
                    <small>${escapeHtml(state.case.id)} · ${escapeHtml(state.case.client)} · Due: ${escapeHtml(state.case.dueDate||"Not set")}</small>
                  </div>
                  <div class="review-item">
                    <strong>Impression Type</strong>
                    <small>${escapeHtml(state.case.impressionType)}</small>
                  </div>
                </div>
                <div class="review-section">
                  <h3>Prescription</h3>
                  ${state.case.items.map(item=>{const product=PRODUCTS[item.productKey];return `<div class="review-item"><strong>${product.label}</strong><small>${item.arch||"Teeth: "+item.teeth.join(", ")} · Qty ${item.quantity}</small><div style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">${configTags(item).map(tag=>`<span style="padding:5px 7px;background:#f0f0f3;border-radius:3px;font-size:10px">${escapeHtml(tag)}</span>`).join("")}</div></div>`;}).join("")}
                </div>
                <div class="review-section">
                  <h3>Checkout</h3>
                  <div class="payment-methods">
                    <button class="payment-method ${payment.method==="card"?"selected":""}" onclick="setPaymentMethod('card')">Credit Card</button>
                    <button class="payment-method ${payment.method==="paypal"?"selected":""}" onclick="setPaymentMethod('paypal')">PayPal</button>
                  </div>
                  ${payment.method==="card"?`
                    <div class="field-group"><label>Name on Card</label><input class="input" value="${escapeHtml(payment.name)}" placeholder="Cardholder name" oninput="state.case.payment.name=this.value"/></div>
                    <div class="field-group"><label>Card Number</label><input class="input" value="${escapeHtml(payment.card)}" placeholder="4242 4242 4242 4242" oninput="state.case.payment.card=this.value"/></div>
                    <div class="option-input-grid">
                      <div class="field-group"><label>Expiry</label><input class="input" value="${escapeHtml(payment.expiry)}" placeholder="MM/YY" oninput="state.case.payment.expiry=this.value"/></div>
                      <div class="field-group"><label>CVV</label><input class="input" value="${escapeHtml(payment.cvv)}" placeholder="123" oninput="state.case.payment.cvv=this.value"/></div>
                    </div>`:`
                    <div class="field-group"><label>PayPal Email</label><input class="input" type="email" value="${escapeHtml(payment.paypalEmail)}" placeholder="paypal@example.com" oninput="state.case.payment.paypalEmail=this.value"/></div>`}
                  <label style="display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:1.45"><input type="checkbox" ${payment.terms?"checked":""} onchange="state.case.payment.terms=this.checked"/><span>I confirm that the prescription and submitted information are correct.</span></label>
                </div>
              </div>
              <aside class="review-summary">
                <h3 style="margin:0 0 13px;color:var(--primary)">Order Summary</h3>
                <div class="review-item"><strong>${serviceLabel()}</strong><small>${state.case.service==="design"?"Delivered by customer download link":state.case.service==="approve"?"Customer approval required":"Approval followed by manufacturing"}</small></div>
                ${state.case.service==="manufacture"?`<div class="review-item"><strong>${state.case.manufactureMethod==="print"?"Print the Design":"Mill the Design"}</strong><small>${state.case.output==="applianceModels"?"Appliance and Models":"Appliance Only"}</small></div>`:""}
                ${renderPriceLines()}
              </aside>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="${state.case.impressionType==="Traditional Impression"?"openFilesModal()":"openFilesModal()"}">
              ${state.case.impressionType==="Traditional Impression"?icon("truck")+" Courier Info":icon("upload")+" Digital Files"}
            </button>
            <button class="btn btn-success" onclick="submitCase()">${icon("check")} Pay &amp; Submit</button>
          </div>
        </section>`);
    }

    function setPaymentMethod(method) { state.case.payment.method=method; renderReviewModal(); }

    function submitCase() {
      if(!validateCaseBasics())return;
      if(!validateFiles()){openFilesModal();return;}
      const payment=state.case.payment;
      if(!payment.terms){showToast("Please confirm the prescription.");return;}
      if(payment.method==="card"){if(!payment.name.trim()||!payment.card.trim()||!payment.expiry.trim()||!payment.cvv.trim()){showToast("Complete the credit card fields.");return;}}
      else if(!payment.paypalEmail.trim()){showToast("Enter the PayPal email.");return;}

      // Auto-generate reference on first submission
      if (!state.case.reference) state.case.reference = generateReference();

      state.case.status="Submitted"; state.case.updatedAt=new Date().toISOString();
      const cases=storedCases();
      const index=cases.findIndex(item=>item.id===state.case.id);
      if(index===-1)cases.push(clone(state.case)); else cases[index]=clone(state.case);
      persistCases(cases); renderSuccessModal(); render();
    }

    function renderSuccessModal() {
      openModal(`
        <section class="modal small">
          <div class="success-view">
            <div class="success-icon">${icon("check")}</div>
            <h2>Case submitted successfully</h2>
            <p>The case has been routed according to the selected prescription and service.</p>
            <p>Case Reference: <strong>${escapeHtml(state.case.reference)}</strong><br>Case ID: <strong>${escapeHtml(state.case.id)}</strong><br>Service: <strong>${serviceLabel()}</strong></p>
            <button class="btn btn-primary" onclick="closeModal()">Return to Project</button>
            <button class="btn btn-outline" onclick="downloadPrescription()">${icon("download")} Download Prescription</button>
          </div>
        </section>`);
    }

    /* =========================================================
       Prescription download
    ========================================================= */
    function downloadPrescription() {
      const totals=calculateTotals();
      const lines=["DENTAL CASE PRESCRIPTION","========================",`Case Reference: ${state.case.reference}`,`Case ID: ${state.case.id}`,`Patient: ${state.case.patientName}`,`Client: ${state.case.client}`,`Due Date: ${state.case.dueDate}`,`Service: ${serviceLabel()}`,`Shade: ${state.case.shade}`,`Impression Type: ${state.case.impressionType}`,"","ITEMS"];
      state.case.items.forEach((item,index)=>{const product=PRODUCTS[item.productKey];lines.push(`${index+1}. ${product.label}`,`   Teeth / Arch: ${item.arch||item.teeth.join(", ")}`,`   Quantity: ${item.quantity}`,`   Material: ${item.material||"N/A"}`,`   Shade: ${item.shade||"N/A"}`);});
      lines.push("",`Total: ${money(totals.total)}`);
      const blob=new Blob([lines.join("\n")],{type:"text/plain"});
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a"); a.href=url; a.download=`${state.case.reference||state.case.id||"case"}-prescription.txt`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000);
    }

    /* =========================================================
       Modal / Help
    ========================================================= */
    function openModal(content) { document.getElementById("modalRoot").innerHTML=`<div class="modal-backdrop" onclick="modalBackdropClose(event)">${content}</div>`; }
    function closeModal() { document.getElementById("modalRoot").innerHTML=""; }
    function modalBackdropClose(event) { if(event.target.classList.contains("modal-backdrop"))closeModal(); }

    function showHelp() {
      openModal(`
        <section class="modal small">
          <div class="modal-header"><h2>How to Create a Case</h2><button class="modal-close" onclick="closeModal()">×</button></div>
          <div class="modal-body" style="line-height:1.65">
            <ol>
              <li>Enter the patient name and due date.</li>
              <li>Select the impression type on the right of the dental chart.</li>
              <li>Click a tooth in the dental chart.</li>
              <li>Hold Ctrl/Cmd or activate Multi-select to choose additional teeth.</li>
              <li>Choose a product from the left panel.</li>
              <li>Select material and product-specific options.</li>
              <li>Click OK to add the prescription item.</li>
              <li>Select service and review the calculated price.</li>
              <li>Click Save.</li>
              <li>${`For Intra Oral / Bench top scan: Upload required digital files. For Traditional Impression: send via courier.`}</li>
              <li>Review, complete payment and submit.</li>
            </ol>
            <div class="modal-note">Full Denture and Bite Splint products select one complete arch and register as quantity one.</div>
          </div>
          <div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">Got It</button></div>
        </section>`);
    }

    render();
  </script>
</body>
</html>
